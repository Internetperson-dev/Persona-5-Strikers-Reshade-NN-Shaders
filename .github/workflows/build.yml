name: Build Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      # Required by Reloaded.Checks.targets; the build output is overridden by -o below.
      RELOADEDIIMODS: ${{ github.workspace }}\Mods
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 7
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x

      - name: Publish mod
        run: dotnet publish P5S.ReShade.csproj -c Release -o publish

      - name: Package mod as zip
        run: Compress-Archive -Path publish\* -DestinationPath P5S.ReShade.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: P5S.ReShade
          path: |
            publish/
            P5S.ReShade.zip
