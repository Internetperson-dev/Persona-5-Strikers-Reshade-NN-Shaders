name: Build Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Required by Reloaded.Checks.targets; the build output is overridden by -o below.
      RELOADEDIIMODS: ${{ github.workspace }}\Mods
      # Unique version per CI run, e.g. 1.0.5 for the 5th workflow run.
      MOD_VERSION: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 7
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x

      - name: Set mod version
        shell: pwsh
        run: |
          $config = Get-Content ModConfig.json -Raw | ConvertFrom-Json
          $config.ModVersion = $env:MOD_VERSION
          $config | ConvertTo-Json -Depth 10 | Set-Content ModConfig.json -Encoding UTF8

      - name: Publish mod
        run: dotnet publish P5S.ReShade.csproj -c Release -o publish

      - name: Package mod as zip
        run: Compress-Archive -Path publish\* -DestinationPath P5S.ReShade.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: P5S.ReShade
          path: |
            publish/
            P5S.ReShade.zip

      - name: Create Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.MOD_VERSION }}
          name: P5S ReShade v${{ env.MOD_VERSION }}
          body: |
            Automatic build of `${{ github.sha }}`.

            - **ModVersion:** ${{ env.MOD_VERSION }}
            - **ModDll:** P5S.ReShade.dll

            Attached: `P5S.ReShade.zip` — extract the `publish/` contents into your Reloaded-II `Mods` folder.
          files: P5S.ReShade.zip
